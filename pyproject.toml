[project]
name = "miniclassisland-core"
version = "2.4.1"
description = "MINI ClassIsland Core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]~=3.3.0",
    "redis[hiredis]~=7.3.0",
    "alembic~=1.18.0",
    "fastapi~=0.135.0",
    "grpcio-reflection~=1.78.0",
    "grpcio-tools~=1.78.0",
    "grpcio~=1.78.0",
    "protobuf~=6.33.0",
    "pydantic-settings~=2.16.0",
    "pydantic~=2.12.0",
    "sqlalchemy~=2.0.48",
    "uvicorn[standard]~=0.41.0",
    "pgpy~=0.6.0",
    "standard-imghdr~=3.13.0",
    "argon2-cffi~=25.1.0",
    "pydantic[email]~=2.12.0",
    "pyotp~=2.9.0",
    "python-multipart~=0.0.18",
    "click~=8.3.3",
    "typer~=0.25.1",
    "httpx~=0.28.0",
]

[project.scripts]
miniclassisland = "app.main:main"

[dependency-groups]
dev = [
    "black",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-W ignore::DeprecationWarning:imghdr --cov=app --cov-report=term-missing"
filterwarnings = [
    "error",
    "ignore::cryptography.utils.CryptographyDeprecationWarning",
    "ignore:Selected compression algorithm:UserWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    "ignore:.*imghdr.*:DeprecationWarning",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
omit = [
    "app/Protobuf/*",
    "app/main.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "except Exception:",
    "except \\(KeyError, ValueError\\):",
    "except \\(asyncio\\.CancelledError, asyncio\\.TimeoutError\\):",
    "except KeyError:",
    "except LookupError:",
    "except RuntimeError:",
    "if os\\.name != .nt.",
    "if not model:",
]

[tool.black]
target-version = ["py312"]
extend-exclude = "app/Protobuf"

[tool.ruff]
target-version = "py312"
extend-exclude = ["app/Protobuf"]

# Ruff >= 0.16 expands the default rule set; pin the project's existing rules
# so dependency upgrades do not introduce unrelated lint churn.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["app/Protobuf", ".venv"]
